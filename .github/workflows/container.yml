name: Container build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build smoke images (amd64 + arm64, not pushed)
        run: |
          docker buildx build --platform linux/amd64 -f container/Dockerfile -t asg:smoke-amd64 --load .
          docker buildx build --platform linux/arm64 -f container/Dockerfile -t asg:smoke-arm64 --load .

      - name: Boot-smoke both architectures
        run: |
          smoke() {
            local platform="$1" tag="$2" budget="$3"
            local name="asg-smoke-$RANDOM"
            docker run -d --name "$name" --platform "$platform" -p 3210:3210 "$tag"
            for i in $(seq 1 "$budget"); do
              if curl -fsS -o /dev/null http://localhost:3210/; then
                echo "OK: ${platform} served / after ${i}s"
                docker rm -f "$name"
                return 0
              fi
              sleep 1
            done
            echo "FAIL: ${platform} never served / within ${budget}s"
            docker logs "$name" || true
            docker rm -f "$name"
            return 1
          }
          smoke linux/amd64 asg:smoke-amd64 40
          smoke linux/arm64 asg:smoke-arm64 150

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub mirror - active only once DOCKERHUB_USERNAME (variable) and
      # DOCKERHUB_TOKEN (secret) are set together; otherwise skipped (GHCR-only).
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: |
            ghcr.io/junkerderprovinz/trickwork
            name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/trickwork,enable=${{ vars.DOCKERHUB_USERNAME != '' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: container/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
