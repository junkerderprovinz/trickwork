name: Container build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build smoke images (amd64 + arm64, not pushed)
        run: |
          docker buildx build --platform linux/amd64 -f container/Dockerfile -t asg:smoke-amd64 --load .
          docker buildx build --platform linux/arm64 -f container/Dockerfile -t asg:smoke-arm64 --load .

      - name: Boot-smoke both architectures
        run: |
          smoke() {
            local platform="$1" tag="$2" budget="$3"
            local name="asg-smoke-$RANDOM"
            docker run -d --name "$name" --platform "$platform" -p 3210:3210 "$tag"
            for i in $(seq 1 "$budget"); do
              if curl -fsS -o /dev/null http://localhost:3210/; then
                echo "OK: ${platform} served / after ${i}s"
                docker rm -f "$name"
                return 0
              fi
              sleep 1
            done
            echo "FAIL: ${platform} never served / within ${budget}s"
            docker logs "$name" || true
            docker rm -f "$name"
            return 1
          }
          smoke linux/amd64 asg:smoke-amd64 40
          smoke linux/arm64 asg:smoke-arm64 150

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub mirror - active only once DOCKERHUB_USERNAME (variable) and
      # DOCKERHUB_TOKEN (secret) are set together; otherwise skipped (GHCR-only).
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Is the tag being built the newest release in this repo?
      #
      # This answers the second half of the question the `latest` line below
      # asks. Gating `latest` on a tag alone would let a re-cut of an older
      # version drag `latest` backwards onto it, which is exactly what happened
      # on 2026-09-02, so the highest version has to win as well.
      #
      # checkout brings no tags with it, so they are fetched here rather than
      # assumed. `sort -V` compares versions instead of strings, which is why
      # v1.10.0 beats v1.9.0.
      - name: Is this the newest release tag?
        id: newest
        if: github.ref_type == 'tag'
        run: |
          git fetch --tags --force --quiet
          newest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          echo "this tag: ${GITHUB_REF_NAME}"
          echo "newest:   ${newest}"
          if [ "$newest" = "${GITHUB_REF_NAME}" ]; then
            echo "is_newest=true" >> "$GITHUB_OUTPUT"
            echo "-> this build moves :latest"
          else
            echo "is_newest=false" >> "$GITHUB_OUTPUT"
            echo "-> this build leaves :latest where it is"
          fi

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: |
            ghcr.io/junkerderprovinz/trickwork
            name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/trickwork,enable=${{ vars.DOCKERHUB_USERNAME != '' }}
          # `latest` means "the newest released version", and nothing else.
          #
          # It used to mean "the tip of the default branch". Those are not the
          # same thing: on 2026-09-14 a 23-commit merge to main handed an
          # unreleased build to everyone pulling `latest` before any release
          # existed, and the first bug report against it arrived before the
          # release notes did. So a tag build sets `latest`, and only when that
          # tag is the newest release (see the step above). The two conditions
          # guard opposite accidents: the tag condition keeps unreleased code
          # off `latest`, and the newest condition keeps an old re-cut version
          # from pulling `latest` back to it.
          #
          # The tip of the default branch gets `edge` instead. It is still
          # built, still pushed and still pullable, but nobody lands on it
          # without asking for it by name.
          #
          # {{major}} and {{major}}.{{minor}} below stay sharp on purpose: they
          # follow whichever tag built last, so re-cutting an old version moves
          # `1` back with it. That is right for a normal forward release and
          # wrong only while folding an old version, which is rare enough to
          # sort out by hand afterwards.
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && steps.newest.outputs.is_newest == 'true' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: container/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
