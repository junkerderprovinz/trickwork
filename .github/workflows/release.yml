name: Release

# Publishes the GitHub Release for a vX.Y.Z tag from its hand-written notes.
# desktop.yml attaches the platform bundles once the release exists, and
# container.yml pushes the versioned image on the same tag.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then
            echo "missing $notes: every tag needs a hand-written release-notes file" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$notes" \
            --repo "$GITHUB_REPOSITORY"
