# Pushes the README to the Docker Hub Overview, on demand. It builds nothing and
# touches nothing but the description, so a failing run points at the
# credential alone.
name: Docker Hub description

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync README to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # No gate and no continue-on-error: this workflow exists to make a failure
      # visible, so a missing secret or a refused login must turn the run red
      # instead of passing quietly.
      - name: Sync README to Docker Hub
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/trickwork
          short-description: "Turns images into proportional-font-aware ASCII art, with a live preview and TXT/XHTML/RTF/PNG export"
          enable-url-completion: true
