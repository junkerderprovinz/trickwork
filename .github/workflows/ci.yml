name: CI

# The pull request gate; container.yml and desktop.yml never run on a pull
# request.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests + typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (core)
        run: npm run test --workspace core

      # ui resolves trickwork-core through core/dist, which only exists after
      # a build.
      - name: Build core
        run: npm run build --workspace core

      - name: Unit tests (ui)
        run: npm run test --workspace ui

      - name: Typecheck (core + ui)
        run: npm run typecheck

  e2e:
    name: E2E (ui, Playwright)
    runs-on: ubuntu-latest
    # A separate job, so a slow or flaky browser run never holds up the unit
    # tests.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Playwright drives `vite preview`, which serves a dist/ it does not build.
      - name: Build core + ui
        run: npm run build

      - name: Install Playwright browsers
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run e2e --workspace ui
