name: Desktop build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # --installer builds an NSIS installer next to the portable TrickWork.exe.
          - os: windows-latest
            slug: windows-amd64
            args: "--arch amd64 --installer"
          # Built on an ARM runner rather than cross-compiled, so a build that
          # only breaks on ARM breaks here.
          - os: windows-11-arm
            slug: windows-arm64
            args: "--arch arm64 --installer"
          - os: macos-latest
            slug: macos-universal
            args: ""
          - os: ubuntu-latest
            slug: linux-amd64
            args: "--arch amd64"
          - os: ubuntu-24.04-arm
            slug: linux-arm64
            args: "--arch arm64"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # The installer needs makensis, and the runner image has dropped its
      # preinstalled NSIS before (actions/runner-images#11754).
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y
          # The running job does not see choco's PATH change.
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # The CLI writes the build assets for the library, so its version is read
      # from desktop/go.mod, which Renovate keeps current. sed rather than
      # grep -P, which BSD grep on macOS lacks. The CLI links the Linux webview
      # too, and without the tag it wants GTK 4, which the runner does not
      # have. Elsewhere the tag changes nothing.
      - name: Install Wails CLI
        working-directory: desktop
        shell: bash
        run: |
          version=$(sed -n 's|.*github\.com/wailsapp/wails/v3 \(v[0-9][0-9A-Za-z.-]*\).*|\1|p' go.mod | head -1)
          if [ -z "$version" ]; then
            echo "could not read the wails version out of desktop/go.mod" >&2
            exit 1
          fi
          go install -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@"$version"

      # The only install script belongs to the test-only canvas package, which
      # has no Windows ARM binary and fails to compile there.
      - name: Install the interface dependencies
        run: npm install --ignore-scripts

      # Only a tag build knows its version. Every other build stamps an empty
      # one, which makes it a dev build that never updates itself. The script
      # builds the interface, has Wails write the manifest, icons, version
      # resource and Info.plist, and compiles; on Windows it also makes the
      # installer.
      - name: Build
        shell: bash
        run: |
          set -eu
          args="${{ matrix.args }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            args="--version ${GITHUB_REF_NAME#v} $args"
          fi
          node scripts/desktop.mjs $args

      # The .app goes into a .dmg for a first install and into a zip for the
      # updater, which unpacks it beside the running app. ditto keeps the
      # bundle's symlinks; --norsrc and --noextattr leave out the resource forks
      # and extended attributes that would land in the bundle as files its
      # signature does not cover.
      - name: Package macOS .app into a .dmg and a .zip
        if: runner.os == 'macOS'
        working-directory: desktop
        run: |
          set -eu
          hdiutil create -volname "TrickWork" -srcfolder build/bin/TrickWork.app -ov -format UDZO build/bin/TrickWork.dmg
          ditto -c -k --norsrc --noextattr --keepParent build/bin/TrickWork.app build/bin/TrickWork.zip
          rm -rf build/bin/TrickWork.app

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trickwork-${{ matrix.slug }}
          path: desktop/build/bin/*
          if-no-files-found: error

  # Artifacts expire and are only reachable inside Actions, so the bundles go
  # onto the release the tag creates.
  attach:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: bundles

      # One file per platform and option, named for the tag. Windows gets a
      # portable exe and an installer; macOS gets its drag-to-Applications
      # .dmg and the zip the updater takes, and Linux the self-contained binary.
      # checksums.txt lets the desktop app verify an update before using it.
      - name: Package
        run: |
          set -eu
          mkdir -p dist
          cp bundles/trickwork-windows-amd64/TrickWork.exe \
            "dist/trickwork-${GITHUB_REF_NAME}-windows-amd64-portable.exe"
          cp bundles/trickwork-windows-amd64/*-installer.exe \
            "dist/trickwork-${GITHUB_REF_NAME}-windows-amd64-installer.exe"
          cp bundles/trickwork-windows-arm64/TrickWork.exe \
            "dist/trickwork-${GITHUB_REF_NAME}-windows-arm64-portable.exe"
          cp bundles/trickwork-windows-arm64/*-installer.exe \
            "dist/trickwork-${GITHUB_REF_NAME}-windows-arm64-installer.exe"
          cp bundles/trickwork-macos-universal/TrickWork.dmg \
            "dist/trickwork-${GITHUB_REF_NAME}-macos-universal.dmg"
          cp bundles/trickwork-macos-universal/TrickWork.zip \
            "dist/trickwork-${GITHUB_REF_NAME}-macos-universal.zip"
          cp bundles/trickwork-linux-amd64/TrickWork \
            "dist/trickwork-${GITHUB_REF_NAME}-linux-amd64"
          chmod +x "dist/trickwork-${GITHUB_REF_NAME}-linux-amd64"
          cp bundles/trickwork-linux-arm64/TrickWork             "dist/trickwork-${GITHUB_REF_NAME}-linux-arm64"
          chmod +x "dist/trickwork-${GITHUB_REF_NAME}-linux-arm64"
          # releases/latest/download only resolves an exact file name, so every
          # bundle also goes up once without the version for the README's links.
          for f in dist/trickwork-"${GITHUB_REF_NAME}"-*; do
            cp "$f" "$(echo "$f" | sed "s/-${GITHUB_REF_NAME}-/-/")"
          done
          (cd dist && sha256sum -- * > checksums.txt)
          cat dist/checksums.txt
          ls -lh dist

      # release.yml creates the release in parallel, and a runner queue can put
      # it behind these builds.
      - name: Wait for the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for i in $(seq 1 30); do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "release $GITHUB_REF_NAME is there"
              exit 0
            fi
            echo "waiting for release $GITHUB_REF_NAME ($i/30)"
            sleep 20
          done
          echo "release $GITHUB_REF_NAME never appeared; was it created for this tag?" >&2
          exit 1

      - name: Attach the bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
