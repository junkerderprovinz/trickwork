name: Desktop build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            slug: windows-amd64
            extra: ""
          - os: macos-latest
            platform: darwin/universal
            slug: macos-universal
            extra: ""
          - os: ubuntu-latest
            platform: linux/amd64
            slug: linux-amd64
            extra: "-tags webkit2_41"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # Kept in step with desktop/go.mod's own wails/v2 version - Renovate
      # bumps the go.mod library dependency automatically but has no config
      # to also catch this `go install ...@vX` pin (it's a shell string in a
      # workflow file, not a go.mod entry), so a Renovate library bump alone
      # would otherwise silently leave the CLI on an older version than the
      # library it's generating bindings against.
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      # GitHub Actions runs `run:` steps under pwsh by default on windows-latest,
      # not bash - `rm -rf` is a bash-ism with no pwsh equivalent flag, so this
      # step needs an explicit shell. Git Bash ships on windows-latest runners
      # specifically so cross-platform build steps like this one work unchanged.
      - name: Build ui/ and populate webembed/dist
        shell: bash
        run: |
          npm install
          npm run build --workspace core
          npm run build --workspace ui
          rm -rf webembed/dist
          cp -r ui/dist webembed/dist

      - name: Build
        working-directory: desktop
        run: |
          go mod tidy
          wails build -platform ${{ matrix.platform }} -clean ${{ matrix.extra }}

      # macOS gets no built-in Wails installer step (unlike -nsis on Windows) -
      # wraps the .app bundle it just built into a real .dmg with hdiutil,
      # already present on every macos-latest runner, no extra tooling needed.
      # The bare .app is removed afterward so only the .dmg (the one file a
      # user should actually download) reaches the artifact.
      - name: Package macOS .app into a .dmg
        if: runner.os == 'macOS'
        working-directory: desktop
        run: |
          set -eu
          hdiutil create -volname "TrickWork" -srcfolder build/bin/TrickWork.app -ov -format UDZO build/bin/TrickWork.dmg
          rm -rf build/bin/TrickWork.app

      - uses: actions/upload-artifact@v4
        with:
          name: trickwork-${{ matrix.slug }}
          path: desktop/build/bin/*
          if-no-files-found: error

  # Without this job the bundles are built on every tag and then thrown away
  # when the artifact expires: green CI, and nobody outside Actions can download
  # the desktop app at all. This attaches them to the release the tag creates.
  attach:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles

      # One file per platform, named for the tag - not a zip of the raw build
      # output. Windows ships as a portable, no-install .exe (jdp: "Die
      # Desktopversion soll portable sein und ohne installation nutzbar
      # sein... bei windows eine 64 bit version" - reverses the earlier NSIS
      # installer decision; windows/amd64 in the build matrix above already
      # is the 64-bit build, so nothing changes there, just what ships).
      # macOS's .dmg is Apple's own drag-to-Applications convention, not an
      # installer wizard with registry/service side effects, so it stays.
      # Linux has no single-file installer convention either, so its own
      # "installation file" is the raw self-contained binary (chmod +x &&
      # run) - already portable, unchanged.
      - name: Package
        run: |
          set -eu
          mkdir -p dist
          cp bundles/trickwork-windows-amd64/TrickWork.exe \
            "dist/trickwork-${GITHUB_REF_NAME}-windows-amd64-portable.exe"
          cp bundles/trickwork-macos-universal/TrickWork.dmg \
            "dist/trickwork-${GITHUB_REF_NAME}-macos-universal.dmg"
          cp bundles/trickwork-linux-amd64/TrickWork \
            "dist/trickwork-${GITHUB_REF_NAME}-linux-amd64"
          chmod +x "dist/trickwork-${GITHUB_REF_NAME}-linux-amd64"
          ls -lh dist

      # The release is expected to exist for this tag by the time the bundles are
      # ready, but these builds can easily take longer than release creation - and
      # a runner queue can invert that further. So wait for it rather than racing it.
      - name: Wait for the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for i in $(seq 1 30); do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "release $GITHUB_REF_NAME is there"
              exit 0
            fi
            echo "waiting for release $GITHUB_REF_NAME ($i/30)"
            sleep 20
          done
          echo "release $GITHUB_REF_NAME never appeared; was it created for this tag?" >&2
          exit 1

      - name: Attach the bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
