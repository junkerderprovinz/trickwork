name: Desktop build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            slug: windows-amd64
            # -nsis builds an NSIS installer next to the portable TrickWork.exe.
            extra: "-nsis"
          # Built on an ARM runner rather than cross-compiled, so a build that
          # only breaks on ARM breaks here.
          - os: windows-11-arm
            platform: windows/arm64
            slug: windows-arm64
            extra: "-nsis"
          - os: macos-latest
            platform: darwin/universal
            slug: macos-universal
            extra: ""
          - os: ubuntu-latest
            platform: linux/amd64
            slug: linux-amd64
            extra: "-tags webkit2_41"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # -nsis needs makensis, and the runner image has dropped its
      # preinstalled NSIS before (actions/runner-images#11754).
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y
          # The running job does not see choco's PATH change, and wails only
          # warns "makensis not found" and skips the installer.
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Keep in step with wails/v2 in desktop/go.mod: Renovate bumps the
      # library but not this pin, and the CLI generates bindings against it.
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      # windows-latest defaults to pwsh, which has no `rm -rf`. The only install
      # script belongs to the test-only canvas package, which has no Windows ARM
      # binary and fails to compile there.
      - name: Build ui/ and populate webembed/dist
        shell: bash
        run: |
          npm install --ignore-scripts
          npm run build --workspace core
          npm run build --workspace ui
          rm -rf webembed/dist
          cp -r ui/dist webembed/dist

      - name: Build
        working-directory: desktop
        run: |
          go mod tidy
          wails build -platform ${{ matrix.platform }} -clean ${{ matrix.extra }}

      # Wails has no macOS installer step, so the .app goes into a .dmg and
      # only the .dmg reaches the artifact.
      - name: Package macOS .app into a .dmg
        if: runner.os == 'macOS'
        working-directory: desktop
        run: |
          set -eu
          hdiutil create -volname "TrickWork" -srcfolder build/bin/TrickWork.app -ov -format UDZO build/bin/TrickWork.dmg
          rm -rf build/bin/TrickWork.app

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trickwork-${{ matrix.slug }}
          path: desktop/build/bin/*
          if-no-files-found: error

  # Artifacts expire and are only reachable inside Actions, so the bundles go
  # onto the release the tag creates.
  attach:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: bundles

      # One file per platform and option, named for the tag. Windows gets a
      # portable exe and an installer; macOS gets its drag-to-Applications
      # .dmg and Linux the self-contained binary.
      - name: Package
        run: |
          set -eu
          mkdir -p dist
          cp bundles/trickwork-windows-amd64/TrickWork.exe \
            "dist/trickwork-${GITHUB_REF_NAME}-windows-amd64-portable.exe"
          cp bundles/trickwork-windows-amd64/*-installer.exe \
            "dist/trickwork-${GITHUB_REF_NAME}-windows-amd64-installer.exe"
          cp bundles/trickwork-windows-arm64/TrickWork.exe \
            "dist/trickwork-${GITHUB_REF_NAME}-windows-arm64-portable.exe"
          cp bundles/trickwork-windows-arm64/*-installer.exe \
            "dist/trickwork-${GITHUB_REF_NAME}-windows-arm64-installer.exe"
          cp bundles/trickwork-macos-universal/TrickWork.dmg \
            "dist/trickwork-${GITHUB_REF_NAME}-macos-universal.dmg"
          cp bundles/trickwork-linux-amd64/TrickWork \
            "dist/trickwork-${GITHUB_REF_NAME}-linux-amd64"
          chmod +x "dist/trickwork-${GITHUB_REF_NAME}-linux-amd64"
          # releases/latest/download only resolves an exact file name, so every
          # bundle also goes up once without the version for the README's links.
          for f in dist/trickwork-"${GITHUB_REF_NAME}"-*; do
            cp "$f" "$(echo "$f" | sed "s/-${GITHUB_REF_NAME}-/-/")"
          done
          ls -lh dist

      # release.yml creates the release in parallel, and a runner queue can put
      # it behind these builds.
      - name: Wait for the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for i in $(seq 1 30); do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "release $GITHUB_REF_NAME is there"
              exit 0
            fi
            echo "waiting for release $GITHUB_REF_NAME ($i/30)"
            sleep 20
          done
          echo "release $GITHUB_REF_NAME never appeared; was it created for this tag?" >&2
          exit 1

      - name: Attach the bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
